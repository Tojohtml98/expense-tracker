# La API está en el plan gratis de Render: se duerme a los 15 min sin uso y el
# primer pedido tarda 30-50 s en despertarla. Este ping cada 10 min la mantiene
# despierta para que la app abra al toque (un servicio prendido todo el mes = ~744 h,
# entra en las 750 h gratis de Render).
name: Mantener la API despierta

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://expense-tracker-zsp9.onrender.com/health
