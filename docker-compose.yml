services:
  mongo:
    image: mongo:7
    container_name: expense-tracker-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  api:
    build: ./server
    container_name: expense-tracker-api
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/expense-tracker
      NODE_ENV: production
    ports:
      - '4000:4000'

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: expense-tracker-client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '5173:80'

volumes:
  mongo-data:
